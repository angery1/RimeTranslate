name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Format check
        shell: pwsh
        run: |
          $diff = gofmt -d .\src\main.go
          if ($diff) { $diff; throw 'gofmt changes required' }
      - name: Vet
        run: go vet ./src
      - name: Build Windows GUI executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o dist\RimeTranslate.exe ./src
      - uses: actions/upload-artifact@v4
        with:
          name: RimeTranslate-windows-x64
          path: dist/RimeTranslate.exe
